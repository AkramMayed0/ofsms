name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Deployed web app URL (https://...)'
        required: true
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor Android project
        working-directory: apps/mobile
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          mkdir -p www assets
          echo '<!doctype html><title>OFSMS</title>' > www/index.html
          cp ../frontend/public/logo.png assets/icon-only.png
          cp ../frontend/public/logo.png assets/icon-foreground.png
          cp ../frontend/public/logo.png assets/splash.png
          cat > capacitor.config.json <<JSON
          {
            "appId": "org.namaa.ofsms",
            "appName": "نظام نماء",
            "webDir": "www",
            "server": { "url": "$SITE_URL", "cleartext": false },
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' || echo "icon generation skipped"
          npx cap sync android

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ofsms-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
