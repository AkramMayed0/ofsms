name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Deployed web app URL (https://...)'
        required: true
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor Android project
        working-directory: apps/mobile
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          echo '<!doctype html><title>OFSMS</title>' > www/index.html
          cat > capacitor.config.json <<JSON
          {
            "appId": "org.namaa.ofsms",
            "appName": "نظام نماء",
            "webDir": "www",
            "server": { "url": "$SITE_URL", "cleartext": false },
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          # Launcher icons from the logo (plain PNGs; drop the adaptive-icon XMLs that need extra resources)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=$RES/mipmap-${d%%:*}; px=${d##*:}
            mkdir -p $dir
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert ../frontend/public/logo.png -resize ${px}x${px} $dir/$n.png
            done
          done
          npx cap sync android

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ofsms-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
